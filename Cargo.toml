cargo-features = ["panic-immediate-abort"]

[package]
name = "keyremapper"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "键盘映射 - Windows 按键重映射工具（Rust + WinUI 3）"
license = "MIT"
repository = "https://github.com/MMCKB/Keyboard-Mapping-Rust"

[[bin]]
name = "KeyRemapper"
path = "src/main.rs"

[dependencies]
windows-reactor = "0.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "immediate-abort"
strip = true
